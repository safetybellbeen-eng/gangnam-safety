<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>강남구 사업장 지도 | 안전보건 업무지원 시스템</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="강남구 안전보건 업무지원 사업장 위치 조회 시스템">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사업장지도">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  :root{
    --gov-navy:#0b3d6e;
    --gov-navy-dark:#082c50;
    --gov-blue:#1866c8;
    --gov-blue-light:#e8f1fc;
    --gov-sky:#4a8fd6;
    --ink:#1c2733;
    --ink-soft:#5b6b7c;
    --line:#dbe3ec;
    --line-soft:#eef2f7;
    --bg:#f2f5f8;
    --panel:#ffffff;
    --warn:#c05e0f;
    --warn-soft:#fdf1e4;
    --danger:#c02f26;
    --danger-soft:#fbeae8;
    --ok:#1a7a4c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ===== 로그인 게이트 (정부24풍) ===== */
  #gate{
    position:fixed;
    inset:0;
    background:linear-gradient(160deg, var(--gov-navy) 0%, var(--gov-navy-dark) 55%, #061f3a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  #gate-topbar{
    position:absolute;
    top:0; left:0; right:0;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:8px;
    color:#cfe0f5;
    font-size:12px;
    font-weight:600;
    letter-spacing:.2px;
  }
  #gate-topbar .gov-mark{
    width:20px;height:20px;
    border-radius:4px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--gov-navy);
    font-weight:800;
    font-size:11px;
  }
  #gate-box{
    background:var(--panel);
    border-radius:14px;
    padding:38px 36px 32px;
    width:340px;
    max-width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  #gate-emblem{
    width:46px;height:46px;
    border-radius:10px;
    background:var(--gov-navy);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  #gate-emblem svg{width:24px;height:24px;}
  #gate-box h2{
    font-size:18px;
    margin:0 0 4px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-0.3px;
  }
  #gate-box p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 22px;
    line-height:1.5;
  }
  #gate-box label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  #gate-box input{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14px;
    outline:none;
    background:#fbfcfd;
  }
  #gate-box input:focus{border-color:var(--gov-blue);background:#fff;}
  #gate-btn{
    width:100%;
    margin-top:22px;
    padding:12px;
    background:var(--gov-navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.2px;
  }
  #gate-btn:active{background:var(--gov-navy-dark);}
  #gate-btn:disabled{opacity:.55;cursor:default;}
  #gate-err{
    color:var(--danger);
    font-size:12px;
    margin-top:10px;
    min-height:14px;
    font-weight:600;
  }
  #gate-foot{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line-soft);
    font-size:10.5px;
    color:#9aa7b4;
    line-height:1.6;
  }

  /* ===== 상단바 ===== */
  header{
    background:var(--gov-navy);
    padding:0;
    flex-shrink:0;
    z-index:20;
  }
  #header-top{
    padding:8px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:#a9c3e3;
    font-weight:600;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  #header-top .gov-mark{
    width:16px;height:16px;
    border-radius:3px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--gov-navy);
    font-weight:800;
    font-size:9px;
    flex-shrink:0;
  }
  #header-main{
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header h1{
    font-size:15.5px;
    font-weight:800;
    margin:0;
    white-space:nowrap;
    letter-spacing:-0.2px;
    color:#fff;
  }
  header h1 span{
    color:#8fc0f0;
  }
  .stat-chip{
    font-size:11.5px;
    color:#d8e6f7;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:4px 12px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .stat-chip b{color:#fff;}

  #search-box{
    flex:1;
    max-width:420px;
    position:relative;
    min-width:0;
  }
  #search-input{
    width:100%;
    padding:8px 12px 8px 32px;
    border:none;
    border-radius:20px;
    font-size:13px;
    outline:none;
    background:rgba(255,255,255,.95);
  }
  #search-box::before{
    content:'';
    position:absolute;
    left:11px; top:50%;
    transform:translateY(-50%);
    width:13px;height:13px;
    border:1.6px solid #7a8896;
    border-radius:50%;
    pointer-events:none;
  }
  #search-box::after{
    content:'';
    position:absolute;
    left:20px; top:calc(50% + 5px);
    width:5px;height:1.6px;
    background:#7a8896;
    transform:rotate(45deg);
    pointer-events:none;
  }

  .toolbar-btn{
    padding:7px 13px;
    font-size:12px;
    font-weight:600;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);
    border-radius:20px;
    cursor:pointer;
    color:#d8e6f7;
    white-space:nowrap;
    flex-shrink:0;
  }
  .toolbar-btn.active{
    background:#fff;
    color:var(--gov-navy);
    border-color:#fff;
  }

  /* ===== 본문 레이아웃 ===== */
  #main{
    flex:1;
    display:flex;
    min-height:0;
  }

  #side-panel{
    width:340px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #side-list{
    flex:1;
    overflow-y:auto;
    min-height:0;
    -webkit-overflow-scrolling:touch;
  }

  .dong-group{
    border-bottom:1px solid var(--line-soft);
  }
  .dong-head{
    padding:11px 16px;
    font-size:13px;
    font-weight:700;
    background:var(--bg);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    color:var(--ink);
  }
  .dong-head .cnt{
    font-weight:500;
    color:var(--ink-soft);
    font-size:11.5px;
  }
  .dong-head .arrow{
    font-size:9px;
    color:var(--gov-blue);
    transition:transform .15s;
  }
  .dong-head.open .arrow{transform:rotate(90deg);}
  .dong-items{display:none;}
  .dong-items.open{display:block;}

  .site-item{
    padding:10px 16px 10px 22px;
    font-size:12.5px;
    border-top:1px solid var(--line-soft);
    cursor:pointer;
  }
  .site-item:active,.site-item:hover{background:var(--gov-blue-light);}
  .site-item.selected{background:var(--gov-blue-light);border-left:3px solid var(--gov-blue);padding-left:19px;}
  .site-item .sname{
    font-weight:700;
    color:var(--ink);
    margin-bottom:2px;
  }
  .site-item .saddr{
    color:var(--ink-soft);
    font-size:11.5px;
    line-height:1.45;
  }
  .site-item .sflag{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    padding:1px 6px;
    border-radius:20px;
    margin-left:5px;
    background:var(--warn-soft);
    color:var(--warn);
    vertical-align:middle;
  }

  .review-item{
    padding:11px 16px;
    font-size:12.5px;
    border-top:1px solid var(--line-soft);
  }
  .review-item .sname{font-weight:700;margin-bottom:2px;}
  .review-item .saddr{color:var(--ink-soft);font-size:11.5px;line-height:1.45;margin-bottom:4px;}
  .review-item .sreason{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:var(--danger-soft);
    color:var(--danger);
  }

  #empty-msg{
    padding:44px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.6;
  }

  #map-wrap{
    flex:1;
    position:relative;
    min-width:0;
  }
  #map{
    width:100%;
    height:100%;
  }

  #map-loading{
    position:absolute;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:var(--ink-soft);
    z-index:5;
  }

  .legend{
    position:absolute;
    left:14px;
    bottom:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:11.5px;
    color:var(--ink-soft);
    box-shadow:0 3px 12px rgba(11,61,110,.1);
    z-index:3;
  }
  .legend div{display:flex;align-items:center;gap:6px;margin:3px 0;}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .kakao-info{
    background:#fff;
    border-radius:12px;
    box-shadow:0 6px 24px rgba(11,61,110,.22);
    padding:16px 18px;
    min-width:250px;
    max-width:300px;
    font-size:12.5px;
    line-height:1.55;
    position:relative;
    border-top:3px solid var(--gov-navy);
  }
  .kakao-info .ci-name{
    font-size:14.5px;
    font-weight:800;
    margin-bottom:8px;
    padding-right:20px;
    color:var(--ink);
  }
  .kakao-info .ci-row{margin:3px 0;color:var(--ink-soft);}
  .kakao-info .ci-row b{color:var(--ink);font-weight:700;margin-right:2px;}
  .kakao-info .ci-close{
    position:absolute;
    top:12px;
    right:14px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:16px;
    font-weight:700;
    line-height:1;
  }
  .kakao-info .ci-flag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:var(--warn-soft);
    color:var(--warn);
    margin-top:6px;
  }
  .kakao-info .ci-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
  }
  .ci-btn{
    flex:1;
    padding:8px 6px;
    font-size:12px;
    font-weight:700;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .ci-btn:active{background:var(--bg);}
  .ci-btn-primary{
    background:var(--gov-navy);
    color:#fff;
    border-color:var(--gov-navy);
  }
  .ci-btn-primary:active{background:var(--gov-navy-dark);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#c3cdd8;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== 모바일 반응형 ===== */
  #mobile-sheet-handle{display:none;}

  @media (max-width: 760px){
    #header-main{padding:9px 12px;flex-wrap:nowrap;}
    header h1{font-size:14px;}
    .stat-chip{display:none;}
    #search-input{font-size:16px;} /* iOS 확대 방지 */

    #main{position:relative;}
    #map-wrap{width:100%;}

    #side-panel{
      position:absolute;
      left:0; right:0; bottom:0;
      width:100%;
      height:42vh;
      border-right:none;
      border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      box-shadow:0 -6px 20px rgba(11,61,110,.15);
      z-index:8;
      transition:height .25s ease;
    }
    #side-panel.collapsed{height:96px;}
    #side-panel.expanded{height:78vh;}

    #mobile-sheet-handle{
      display:flex;
      justify-content:center;
      padding:9px 0 6px;
      flex-shrink:0;
      cursor:pointer;
    }
    #mobile-sheet-handle span{
      width:38px;height:4px;
      background:var(--line);
      border-radius:3px;
    }

    .kakao-info{max-width:250px;min-width:210px;padding:14px 16px;}
  }

  @media (min-width:761px){
    #mobile-sheet-handle{display:none !important;}
  }
</style>
</head>
<body>

<div id="gate">
  <div id="gate-topbar">
    <div class="gov-mark">GOV</div>
    <span>대한민국 정부 · 공무원 업무지원 시스템</span>
  </div>
  <div id="gate-box">
    <div id="gate-emblem">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7V9H21V7L12 2Z" fill="#fff"/>
        <path d="M4 10H6V18H4V10ZM10 10H12V18H10V10ZM16 10H18V18H16V10Z" fill="#fff"/>
        <path d="M2 20H22V22H2V20Z" fill="#fff"/>
      </svg>
    </div>
    <h2>강남구 사업장 지도</h2>
    <p>안전보건 업무지원 시스템 · 지정된 담당자만 접근할 수 있습니다</p>
    <label>아이디</label>
    <input type="text" id="gate-id" autocomplete="username" placeholder="아이디를 입력하세요">
    <label>비밀번호</label>
    <input type="password" id="gate-pw" autocomplete="current-password" placeholder="비밀번호를 입력하세요">
    <button id="gate-btn">로그인</button>
    <div id="gate-err"></div>
    <div id="gate-foot">본 시스템은 내부 업무용으로 제작되었으며, 접근 권한이 없는 경우 이용할 수 없습니다.</div>
  </div>
</div>

<header style="display:none" id="app-header">
  <div id="header-top">
    <div class="gov-mark">GOV</div>
    <span>안전보건 업무지원 시스템</span>
  </div>
  <div id="header-main">
    <h1>강남구 <span>사업장 지도</span></h1>
    <div class="stat-chip"><b id="stat-total">-</b>건 표시중</div>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="사업장명, 주소, 업체명으로 검색">
    </div>
    <button class="toolbar-btn active" id="btn-tab-sites">사업장</button>
    <button class="toolbar-btn" id="btn-tab-review">확인필요(<span id="review-count">-</span>)</button>
  </div>
</header>

<div id="main" style="display:none">
  <div id="map-wrap">
    <div id="map-loading">지도를 불러오는 중…</div>
    <div id="map"></div>
    <div class="legend">
      <div><span class="dot" style="background:#0b3d6e"></span>사업장 위치</div>
      <div><span class="dot" style="background:#0b3d6e;opacity:.4"></span>정확도 낮음(참고용)</div>
    </div>
  </div>
  <div id="side-panel" class="collapsed">
    <div id="mobile-sheet-handle"><span></span></div>
    <div id="side-list"></div>
  </div>
</div>

<script>
/* 암호화된 데이터 (AES-GCM, PBKDF2-SHA256 100000회) */

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function deriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBytes, iterations: 100000, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
}

async function tryUnlock(id, pw){
  const password = id + ':' + pw;
  const saltBytes = b64ToBytes(ENC_SALT);
  const nonceBytes = b64ToBytes(ENC_NONCE);
  const ctBytes = b64ToBytes(ENC_CT);
  const key = await deriveKey(password, saltBytes);
  const plainBuf = await crypto.subtle.decrypt(
    { name:'AES-GCM', iv: nonceBytes }, key, ctBytes
  );
  const text = new TextDecoder().decode(plainBuf);
  return JSON.parse(text);
}

document.getElementById('gate-btn').addEventListener('click', doLogin);
document.getElementById('gate-pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('gate-id').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const id = document.getElementById('gate-id').value.trim();
  const pw = document.getElementById('gate-pw').value;
  const errEl = document.getElementById('gate-err');
  const btn = document.getElementById('gate-btn');
  if(!id || !pw){
    errEl.textContent = '아이디와 비밀번호를 입력하세요.';
    return;
  }
  btn.disabled = true;
  btn.textContent = '확인 중…';
  errEl.textContent = '';
  try{
    const data = await tryUnlock(id, pw);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app-header').style.display = 'block';
    document.getElementById('main').style.display = 'flex';
    window.CONFIRMED = data.c;
    window.REVIEW = data.r;
    initApp();
  }catch(err){
    errEl.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a0fc541739819cba51e7dc418180cb05&libraries=clusterer&autoload=false"></script>
<script>
/* ===== 상태 ===== */
let map, clusterer;
let markers = [];
let currentInfo = null;
let activeTab = 'sites';
let selectedIndex = -1;
let CONFIRMED, REVIEW;

/* 법정동별 대략 중심좌표(강남구, 초기 라벨용 — 실제 표시엔 미사용, 그룹핑만) */
const DONG_ORDER = ['신사동','논현동','압구정동','청담동','삼성동','대치동','역삼동','도곡동',
  '개포동','일원동','수서동','세곡동','자곡동','율현동'];

/* ===== 초기화 (로그인 성공 후 호출됨) ===== */
function initApp(){
  CONFIRMED = window.CONFIRMED;
  REVIEW = window.REVIEW;

  document.getElementById('stat-total').textContent = CONFIRMED.length;
  document.getElementById('review-count').textContent = REVIEW.length;

  kakao.maps.load(function(){
    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(37.4979, 127.0492), // 강남구청 부근
      level: 7
    };
    map = new kakao.maps.Map(container, options);
    map.setMaxLevel(11);

    document.getElementById('map-loading').style.display = 'none';

    clusterer = new kakao.maps.MarkerClusterer({
      map: map,
      averageCenter: true,
      minLevel: 6,
      disableClickZoom: false,
      styles: [{
        width:'40px', height:'40px',
        background:'rgba(31,95,191,.85)',
        borderRadius:'20px',
        color:'#fff',
        textAlign:'center',
        lineHeight:'40px',
        fontSize:'13px',
        fontWeight:'700'
      }]
    });

    buildMarkers();
    renderSideList();
    attachHandlers();
    attachMobileSheet();
  });
}

/* ===== 모바일 하단 시트 인터랙션 ===== */
function attachMobileSheet(){
  const handle = document.getElementById('mobile-sheet-handle');
  const panel = document.getElementById('side-panel');
  if(!handle) return;

  handle.addEventListener('click', () => {
    panel.classList.toggle('expanded');
    panel.classList.toggle('collapsed');
  });

  // 목록 항목을 탭하면 자동으로 접어서 지도를 보여줌(모바일 전용)
  document.getElementById('side-list').addEventListener('click', (e) => {
    if(window.innerWidth <= 760 && e.target.closest('.site-item')){
      panel.classList.remove('expanded');
      panel.classList.add('collapsed');
    }
  });
}

/* ===== 마커 생성 ===== */
function buildMarkers(){
  CONFIRMED.forEach((s, idx) => {
    const pos = new kakao.maps.LatLng(s.lat, s.lng);
    const marker = new kakao.maps.Marker({
      position: pos,
      opacity: s.ap ? 0.55 : 1,
      title: s.n
    });
    marker.__idx = idx;
    kakao.maps.event.addListener(marker, 'click', () => {
      selectSite(idx, true);
    });
    markers.push(marker);
  });
  clusterer.addMarkers(markers);
}

/* ===== 좌측 목록 렌더 ===== */
function renderSideList(){
  const listEl = document.getElementById('side-list');
  listEl.innerHTML = '';

  if(activeTab === 'sites'){
    renderSitesList(listEl, '');
  } else {
    renderReviewList(listEl, '');
  }
}

function groupByDong(items){
  const groups = {};
  items.forEach((s, idx) => {
    const key = s.d || '기타';
    if(!groups[key]) groups[key] = [];
    groups[key].push(idx);
  });
  return groups;
}

function renderSitesList(listEl, filterText){
  const filtered = CONFIRMED
    .map((s, idx) => ({...s, _idx: idx}))
    .filter(s => matchesFilter(s, filterText));

  if(filtered.length === 0){
    listEl.innerHTML = '<div id="empty-msg">검색 결과가 없습니다.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(s => {
    const key = s.d || '기타';
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  const dongKeys = Object.keys(groups).sort((a,b) => {
    const ia = DONG_ORDER.indexOf(a), ib = DONG_ORDER.indexOf(b);
    return (ia<0?999:ia) - (ib<0?999:ib);
  });

  const frag = document.createDocumentFragment();
  dongKeys.forEach(dong => {
    const items = groups[dong];
    const groupDiv = document.createElement('div');
    groupDiv.className = 'dong-group';

    const head = document.createElement('div');
    head.className = 'dong-head' + (filterText ? ' open' : '');
    head.innerHTML = `<span>${dong}</span><span><span class="cnt">${items.length}건</span> <span class="arrow">▶</span></span>`;

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'dong-items' + (filterText ? ' open' : '');

    items.forEach(s => {
      const div = document.createElement('div');
      div.className = 'site-item';
      div.dataset.idx = s._idx;
      div.innerHTML = `
        <div class="sname">${escapeHtml(s.n)}${s.ap ? '<span class="sflag">정확도낮음</span>' : ''}</div>
        <div class="saddr">${escapeHtml(s.p)}</div>
        <div class="saddr">${escapeHtml(s.a)}</div>
      `;
      div.addEventListener('click', () => selectSite(s._idx, true));
      itemsDiv.appendChild(div);
    });

    head.addEventListener('click', () => {
      head.classList.toggle('open');
      itemsDiv.classList.toggle('open');
    });

    groupDiv.appendChild(head);
    groupDiv.appendChild(itemsDiv);
    frag.appendChild(groupDiv);
  });

  listEl.appendChild(frag);
}

function renderReviewList(listEl, filterText){
  const filtered = REVIEW.filter(s => matchesFilterReview(s, filterText));

  if(filtered.length === 0){
    listEl.innerHTML = '<div id="empty-msg">검색 결과가 없습니다.</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  const note = document.createElement('div');
  note.style.cssText = 'padding:12px 14px;font-size:11.5px;color:var(--ink-soft);background:var(--warn-soft);border-bottom:1px solid var(--line);line-height:1.5;';
  note.textContent = '주소 확인이 되지 않아 지도에 표시할 수 없는 사업장 목록입니다. 주소를 직접 확인 후 처리해주세요.';
  frag.appendChild(note);

  filtered.forEach(s => {
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="sname">${escapeHtml(s.n)}</div>
      <div class="saddr">${escapeHtml(s.p)}</div>
      <div class="saddr">${escapeHtml(s.a)}</div>
      <div class="sreason">${escapeHtml(s.r || '주소확인필요')}</div>
    `;
    frag.appendChild(div);
  });

  listEl.appendChild(frag);
}

function matchesFilter(s, text){
  if(!text) return true;
  const t = text.toLowerCase();
  return (s.n && s.n.toLowerCase().includes(t)) ||
         (s.p && s.p.toLowerCase().includes(t)) ||
         (s.a && s.a.toLowerCase().includes(t));
}
function matchesFilterReview(s, text){
  if(!text) return true;
  const t = text.toLowerCase();
  return (s.n && s.n.toLowerCase().includes(t)) ||
         (s.p && s.p.toLowerCase().includes(t)) ||
         (s.a && s.a.toLowerCase().includes(t));
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ===== 사업장 선택 -> 지도 이동 + 정보창 ===== */
function selectSite(idx, moveMap){
  const s = CONFIRMED[idx];
  if(!s) return;

  document.querySelectorAll('.site-item.selected').forEach(el => el.classList.remove('selected'));
  const targetEl = document.querySelector(`.site-item[data-idx="${idx}"]`);
  if(targetEl){
    targetEl.classList.add('selected');
    const parentGroup = targetEl.closest('.dong-items');
    if(parentGroup && !parentGroup.classList.contains('open')){
      parentGroup.classList.add('open');
      parentGroup.previousElementSibling.classList.add('open');
    }
    targetEl.scrollIntoView({block:'nearest'});
  }

  const pos = new kakao.maps.LatLng(s.lat, s.lng);

  if(currentInfo){ currentInfo.close(); }

  const content = document.createElement('div');
  content.className = 'kakao-info';
  content.innerHTML = `
    <div class="ci-close" id="ci-close-btn">&times;</div>
    <div class="ci-name">${escapeHtml(s.n)}</div>
    <div class="ci-row"><b>업체</b> ${escapeHtml(s.p)}</div>
    <div class="ci-row"><b>주소</b> ${escapeHtml(s.a)}</div>
    <div class="ci-row"><b>공사기간</b> ${escapeHtml(s.s)} ~ ${escapeHtml(s.e)}</div>
    <div class="ci-row"><b>공사금액</b> ${formatAmount(s.m)}</div>
    ${s.ap ? '<div class="ci-flag">좌표 정확도 낮음(참고용)</div>' : ''}
    <div class="ci-actions">
      <button class="ci-btn ci-btn-primary" id="ci-nav-btn">길찾기</button>
      <button class="ci-btn" id="ci-copy-btn">주소복사</button>
    </div>
  `;

  currentInfo = new kakao.maps.CustomOverlay({
    position: pos,
    content: content,
    yAnchor: 1.35,
    zIndex: 10
  });
  currentInfo.setMap(map);

  content.querySelector('#ci-close-btn').addEventListener('click', () => {
    currentInfo.setMap(null);
  });
  content.querySelector('#ci-nav-btn').addEventListener('click', () => {
    openNavigation(s);
  });
  content.querySelector('#ci-copy-btn').addEventListener('click', (e) => {
    copyAddress(s.a, e.target);
  });

  if(moveMap){
    map.setLevel(4);
    map.panTo(pos);
  }
}

function formatAmount(v){
  const n = Number(v);
  if(isNaN(n) || n === 0) return '-';
  return n.toLocaleString('ko-KR') + '원';
}

/* ===== 길찾기 / 주소복사 ===== */
function isMobile(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function openNavigation(s){
  const name = encodeURIComponent(s.n || s.p || '목적지');
  if(isMobile()){
    // 카카오맵 앱 스킴 (길찾기, 도착지 좌표 지정)
    const schemeUrl = `kakaomap://route?ep=${s.lat},${s.lng}&by=CAR`;
    const webFallback = `https://map.kakao.com/link/to/${name},${s.lat},${s.lng}`;

    let didHide = false;
    const onVisChange = () => { if(document.hidden) didHide = true; };
    document.addEventListener('visibilitychange', onVisChange);

    window.location.href = schemeUrl;

    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVisChange);
      if(!didHide){
        // 앱이 없으면 웹(카카오맵 길찾기 페이지)으로 대체
        window.open(webFallback, '_blank');
      }
    }, 1200);
  }else{
    // 데스크탑: 카카오맵 웹 길찾기
    const webUrl = `https://map.kakao.com/link/to/${name},${s.lat},${s.lng}`;
    window.open(webUrl, '_blank');
  }
}

function copyAddress(address, btnEl){
  const text = address || '';
  const done = () => {
    if(btnEl){
      const orig = btnEl.textContent;
      btnEl.textContent = '복사됨';
      setTimeout(() => { btnEl.textContent = orig; }, 1200);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

/* ===== 탭 전환 / 검색 (로그인 성공 후 바인딩) ===== */
function attachHandlers(){
  document.getElementById('btn-tab-sites').addEventListener('click', () => {
    activeTab = 'sites';
    document.getElementById('btn-tab-sites').classList.add('active');
    document.getElementById('btn-tab-review').classList.remove('active');
    document.getElementById('search-input').value = '';
    renderSideList();
  });
  document.getElementById('btn-tab-review').addEventListener('click', () => {
    activeTab = 'review';
    document.getElementById('btn-tab-review').classList.add('active');
    document.getElementById('btn-tab-sites').classList.remove('active');
    document.getElementById('search-input').value = '';
    renderSideList();
  });

  let searchDebounce = null;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value.trim();
    searchDebounce = setTimeout(() => {
      const listEl = document.getElementById('side-list');
      listEl.innerHTML = '';
      if(activeTab === 'sites'){
        renderSitesList(listEl, val);
      } else {
        renderReviewList(listEl, val);
      }
    }, 150);
  });
}

</script>
